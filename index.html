  <canvas id="game"></canvas>

  </div>

  <div class="install-hint" id="installHint"></div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreLabel = document.getElementById('scoreLabel');
  const bestLabel = document.getElementById('bestLabel');
  const resultLine = document.getElementById('resultLine');
  const titleEl = overlay.querySelector('.title');
  const subEl = overlay.querySelector('.sub');
  const installHint = document.getElementById('installHint');

  let DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let W, H, groundY;

  function resize(){
    W = canvas.clientWidth = wrap.clientWidth;
    H = canvas.clientHeight = wrap.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    groundY = H * 0.78;
  }
  const wrap = document.getElementById('wrap');
  window.addEventListener('resize', resize);

  // ---------- persistent best score ----------
  let best = 0;
  async function loadBest(){
    try{
      const r = await window.storage.get('kucing-neon-best', false);
      if(r && r.value){ best = parseInt(r.value,10) || 0; }
    }catch(e){ best = 0; }
    bestLabel.textContent = best;
  }
  async function saveBest(v){
    try{ await window.storage.set('kucing-neon-best', String(v), false); }catch(e){}
  }
  loadBest();

  // ---------- game state ----------
  let state = 'ready'; // ready | playing | dead
  let t = 0;
  let speed = 6.2;
  let baseSpeed = 6.2;
  let score = 0;
  let distSinceObstacle = 0;
  let nextObstacleGap = 0;
  let obstacles = [];
  let particles = [];
  let bgLights = [];
  let shakeT = 0;

  const cat = {
    x: 90,
    y: 0,
    vy: 0,
    w: 46,
    h: 40,
    onGround: true,
    legPhase: 0,
    squash: 1
  };

  const GRAVITY = 0.62;
  const JUMP_V = -12.6;

  function resetGame(){
    speed = baseSpeed;
    score = 0;
    obstacles = [];
    particles = [];
    distSinceObstacle = 0;
    nextObstacleGap = 90;
    cat.y = groundY - cat.h;
    cat.vy = 0;
    cat.onGround = true;
    t = 0;
    scoreLabel.textContent = '0';
  }

  function initBgLights(){
    bgLights = [];
    for(let i=0;i<26;i++){
      bgLights.push({
        x: Math.random()*2000,
        y: 40 + Math.random()*(groundY*0.55),
        w: 4 + Math.random()*10,
        h: 20 + Math.random()*70,
        hue: Math.random() < 0.5 ? 'cyan' : 'magenta',
        speedMul: 0.25 + Math.random()*0.3
      });
    }
  }

  function jump(){
    if(state === 'ready'){ startGame(); return; }
    if(state === 'dead'){ return; }
    if(cat.onGround){
      cat.vy = JUMP_V;
      cat.onGround = false;
      spawnParticles(cat.x+cat.w*0.3, groundY, 6, 'jump');
    }
  }

  function spawnParticles(x,y,n,type){
    for(let i=0;i<n;i++){
      particles.push({
        x, y,
        vx: (Math.random()-0.5)* (type==='jump'?3:5),
        vy: type==='jump' ? -Math.random()*2 : -Math.random()*4-1,
        life: 26 + Math.random()*14,
        maxLife: 40,
        type
      });
    }
  }

  function spawnObstacle(){
    const roll = Math.random();
    if(roll < 0.55){
      // AC unit on ground
      const h = 30 + Math.random()*18;
      obstacles.push({
        type:'ac', x: W + 20, y: groundY - h, w: 34, h,
        passed:false
      });
    } else if(roll < 0.85){
      // pigeon flying at jump height
      const y = groundY - cat.h - 46 - Math.random()*30;
      obstacles.push({
        type:'bird', x: W + 20, y, w: 30, h: 20,
        passed:false, wingPhase: Math.random()*10
      });
    } else {
      // fish collectible
      const y = groundY - cat.h - 10 - Math.random()*70;
      obstacles.push({
        type:'fish', x: W + 20, y, w: 26, h: 16,
        passed:false, bob: Math.random()*10
      });
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function startGame(){
    resetGame();
    initBgLights();
    state = 'playing';
    overlay.classList.add('hidden');
  }

  async function die(){
    state = 'dead';
    shakeT = 18;
    spawnParticles(cat.x+cat.w/2, cat.y+cat.h/2, 18, 'burst');
    const finalScore = Math.floor(score);
    let isNew = false;
    if(finalScore > best){ best = finalScore; isNew = true; await saveBest(best); }
    bestLabel.textContent = best;
    setTimeout(()=>{
      titleEl.innerHTML = 'GAME <span>OVER</span>';
      subEl.textContent = isNew ? 'New record! Fastest cat tonight.' : 'Try again, chase your best score.';
      resultLine.textContent = 'Score: ' + finalScore + '   ·   Best: ' + best;
      startBtn.textContent = 'RUN AGAIN';
      overlay.classList.remove('hidden');
    }, 550);
  }

  function update(){
    t++;
    if(state === 'playing'){
      speed = baseSpeed + Math.min(6, score/220);
      score += speed*0.045;
      scoreLabel.textContent = Math.floor(score);

      // physics
      cat.vy += GRAVITY;
      cat.y += cat.vy;
      if(cat.y + cat.h >= groundY){
        cat.y = groundY - cat.h;
        if(!cat.onGround){ spawnParticles(cat.x+cat.w*0.3, groundY, 5, 'jump'); }
        cat.vy = 0;
        cat.onGround = true;
      }
      cat.legPhase += cat.onGround ? speed*0.09 : 0;

      // obstacles
      distSinceObstacle += speed;
      if(distSinceObstacle > nextObstacleGap){
        spawnObstacle();
        distSinceObstacle = 0;
        nextObstacleGap = 150 + Math.random()*130 - Math.min(60, score/12);
        nextObstacleGap = Math.max(95, nextObstacleGap);
      }

      const catBox = {x: cat.x+8, y: cat.y+6, w: cat.w-16, h: cat.h-10};

      for(let i=obstacles.length-1;i>=0;i--){
        const o = obstacles[i];
        o.x -= speed;
        if(o.type==='bird'){ o.wingPhase += 0.35; o.y += Math.sin(t*0.05+o.wingPhase)*0.4; }
        if(o.type==='fish'){ o.bob += 0.08; }

        const obBox = {x:o.x, y:o.y, w:o.w, h:o.h};
        if(rectsOverlap(catBox, obBox)){
          if(o.type === 'fish'){
            score += 25;
            spawnParticles(o.x, o.y, 10, 'sparkle');
            obstacles.splice(i,1);
            continue;
          } else {
            die();
          }
        }
        if(o.x + o.w < -20) obstacles.splice(i,1);
      }

      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx - speed*0.3;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if(p.life<=0) particles.splice(i,1);
      }

      for(const l of bgLights){
        l.x -= speed*l.speedMul;
        if(l.x < -20){ l.x = W + Math.random()*100; l.y = 40+Math.random()*(groundY*0.55); }
      }
    } else if(state==='dead'){
      // continue background gliding a bit
      for(const l of bgLights){ l.x -= 1.5; if(l.x<-20){ l.x = W+50; } }
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
        if(p.life<=0) particles.splice(i,1);
      }
      if(shakeT>0) shakeT--;
    } else {
      // ready idle bob
      cat.legPhase += 0.05;
      for(const l of (bgLights.length? bgLights: (initBgLights(),bgLights))){
        l.x -= 0.6;
        if(l.x < -20){ l.x = W+50; l.y = 40+Math.random()*(groundY*0.55); }
      }
    }
  }

  function drawSkyline(){
    // parallax rooftops
    ctx.save();
    const bH = groundY;
    ctx.fillStyle = '#10133380';
    for(let i=0;i<8;i++){
      const bw = 90;
      const x = ((i*160 - (t*0.4)%160));
      const bhgt = 60 + (i%3)*40;
      ctx.fillRect(x, bH-bhgt-40, bw, bhgt);
    }
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    let shakeX=0, shakeY=0;
    if(shakeT>0){
      shakeX = (Math.random()-0.5)*shakeT*0.8;
      shakeY = (Math.random()-0.5)*shakeT*0.5;
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // sky gradient
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#0B0E23');
    grad.addColorStop(1, '#1B1F4D');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // bg neon lights (windows)
    for(const l of bgLights){
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = l.hue==='cyan' ? '#00E5FF' : '#FF2E93';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 10;
      ctx.fillRect(l.x, l.y, l.w, l.h);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    drawSkyline();

    // ground
    ctx.fillStyle = '#080A1C';
    ctx.fillRect(0, groundY, W, H-groundY);
    ctx.strokeStyle = 'rgba(0,229,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    // ground tick marks scrolling
    ctx.strokeStyle = 'rgba(245,240,255,0.12)';
    const tickSpacing = 40;
    const offset = (t*speed) % tickSpacing;
    for(let x = -offset; x < W; x += tickSpacing){
      ctx.beginPath();
      ctx.moveTo(x, groundY+6);
      ctx.lineTo(x+16, groundY+6);
      ctx.stroke();
    }

    // obstacles
    for(const o of obstacles){
      if(o.type === 'ac'){
        ctx.fillStyle = '#2A2E5C';
        ctx.strokeStyle = 'rgba(255,179,71,0.7)';
        ctx.lineWidth = 1.5;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = 'rgba(255,179,71,0.55)';
        for(let i=0;i<3;i++){
          ctx.fillRect(o.x+4, o.y+6+i*8, o.w-8, 3);
        }
      } else if(o.type === 'bird'){
        const flap = Math.sin(o.wingPhase)*8;
        ctx.strokeStyle = '#F5F0FF';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y);
        ctx.quadraticCurveTo(o.x+o.w*0.3, o.y-flap, o.x+o.w*0.5, o.y);
        ctx.quadraticCurveTo(o.x+o.w*0.7, o.y-flap, o.x+o.w, o.y);
        ctx.stroke();
      } else if(o.type === 'fish'){
        const by = o.y + Math.sin(o.bob)*4;
        ctx.save();
        ctx.translate(o.x+o.w/2, by+o.h/2);
        ctx.fillStyle = '#00E5FF';
        ctx.shadowColor = '#00E5FF';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.ellipse(0,0, o.w/2, o.h/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-o.w/2, 0);
        ctx.lineTo(-o.w/2-8, -6);
        ctx.lineTo(-o.w/2-8, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.shadowBlur = 0;
      }
    }

    // particles
    for(const p of particles){
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.type==='sparkle' ? '#00E5FF' : (p.type==='burst' ? '#FF2E93' : '#F5F0FF');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.type==='burst'?3:2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // cat
    drawCat();

    ctx.restore();
  }

  function drawCat(){
    const bob = state==='playing' && cat.onGround ? Math.sin(cat.legPhase)*2 : 0;
    const x = cat.x, y = cat.y + bob;
    const w = cat.w, h = cat.h;

    ctx.save();
    ctx.translate(x, y);

    // trail glow while jumping
    if(!cat.onGround){
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#FF2E93';
      ctx.shadowColor = '#FF2E93';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.ellipse(w*0.3, h*0.6, w*0.5, h*0.4, 0,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // body
    ctx.fillStyle = '#1A1D40';
    ctx.strokeStyle = '#FF2E93';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#FF2E93';
    ctx.shadowBlur = 8;

    ctx.beginPath();
    ctx.moveTo(4, h*0.55);
    ctx.quadraticCurveTo(0, h*0.15, w*0.35, h*0.1);
    ctx.quadraticCurveTo(w*0.75, 0, w*0.95, h*0.25);
    ctx.quadraticCurveTo(w, h*0.45, w*0.85, h*0.55);
    ctx.lineTo(w*0.85, h*0.85);
    ctx.quadraticCurveTo(w*0.6, h, w*0.3, h*0.9);
    ctx.quadraticCurveTo(4, h*0.85, 4, h*0.55);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // ear
    ctx.fillStyle = '#1A1D40';
    ctx.strokeStyle = '#00E5FF';
    ctx.beginPath();
    ctx.moveTo(w*0.55, h*0.06);
    ctx.lineTo(w*0.65, -h*0.18);
    ctx.lineTo(w*0.78, h*0.1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // eye
    ctx.fillStyle = '#00E5FF';
    ctx.shadowColor = '#00E5FF';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(w*0.82, h*0.28, 2.6, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // tail
    ctx.strokeStyle = '#FF2E93';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    const tailWag = Math.sin(t*0.15)*6;
    ctx.beginPath();
    ctx.moveTo(2, h*0.5);
    ctx.quadraticCurveTo(-10, h*0.3+tailWag, -14, h*0.05+tailWag);
    ctx.stroke();

    // legs
    ctx.strokeStyle = '#F5F0FF';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    const legSwing = cat.onGround && state==='playing' ? Math.sin(cat.legPhase)*8 : 0;
    ctx.beginPath();
    ctx.moveTo(w*0.3, h*0.85);
    ctx.lineTo(w*0.3 + legSwing, h + 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w*0.65, h*0.88);
    ctx.lineTo(w*0.65 - legSwing, h + 4);
    ctx.stroke();

    ctx.restore();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    jump();
  });
  startBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    startGame();
  });

  // ---------- install hint (PWA add-to-home-screen guidance) ----------
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  if(isIOS){
    installHint.textContent = 'Tip: open in Safari → Share button → "Add to Home Screen" to play like an app.';
  } else if(isAndroid){
    installHint.textContent = 'Tip: open in Chrome → menu (⋮) → "Add to Home screen" to play like an app.';
  }

  resize();
  initBgLights();
  cat.y = groundY - cat.h;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
